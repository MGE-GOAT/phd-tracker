<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhD Plan</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#141c26;--muted:#5c6a79;--line:#dfe4ea;--accent:#16707b;--accent-ink:#fff;--accent-soft:#e2f1f2;
--hot:#a4570a;--hot-soft:#fdf0df;--done:#1f7a3f;--done-soft:#e4f4e9;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131a;--card:#161d26;--ink:#e7ecf1;--muted:#93a2b2;--line:#28323e;
--accent:#56c0cc;--accent-ink:#06262a;--accent-soft:#143238;--hot:#f2ab5d;--hot-soft:#3a2a16;--done:#7fd69a;--done-soft:#163222;--chip:#212b36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:auto;padding:0 16px}
header{padding:30px 0 6px}
h1{margin:0;font-size:28px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.next{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px 22px;margin:14px 0 8px}
.next small{opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600}
.next h2{margin:4px 0 6px;font-size:22px}
.next p{margin:0;opacity:.92}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 6px}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.count{color:var(--muted);font-size:14px}
.how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:14px 0}
.how ol{margin:6px 0 0;padding-left:20px}
.how li{margin:3px 0}
h3{margin:26px 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:16px 18px;display:grid;grid-template-columns:38px 1fr;gap:4px 12px}
.step.hot{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot) inset}
.step.done{opacity:.62}
.num{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px}
.step.done .num{background:var(--done-soft);color:var(--done)}
.who{font-weight:700;font-size:17px}
.where{color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.tag.hot{background:var(--hot-soft);color:var(--hot);font-weight:600}
.tag.score{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.dl{background:var(--hot-soft);color:var(--hot)}
.why{margin:2px 0 4px}
.note{font-size:14px;color:var(--hot);margin:4px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-size:14px;border-radius:10px;padding:8px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--done-soft);border-color:var(--done-soft);color:var(--done);font-weight:600}
details.preview{margin-top:10px}
details.preview summary{cursor:pointer;color:var(--muted);font-size:14px}
pre{white-space:pre-wrap;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.visa{font-size:14px;color:var(--muted)}
.visa b{color:var(--ink)}
/* database view */
.dbbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.dbbar input,.dbbar select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.dbbar input{flex:1;min-width:160px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:11px 14px;font-size:14px}
.item b{font-size:15px}
.item .m{color:var(--muted)}
.item details summary{cursor:pointer;color:var(--accent);margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
a{color:var(--accent)}
footer{color:var(--muted);font-size:13px;margin:30px 0 40px}
@media (max-width:560px){.step{grid-template-columns:1fr}.num{display:none}}
</style>
</head>

6-11-13.pdf", "steps": [{"id": "saukh", "batch": 1, "country": "Austria", "who": "Prof. Olga Saukh", "where": "TU Graz", "why": "Embedded machine learning on tiny devices, your exact work. Part of the EU doctoral network ANT.", "kind": "Email", "hot": false, "page": "https://tugraz.at/arbeitsgruppen/iti-teams/elss", "email": "email_saukh.txt", "note": "Her PhD advert page was taken down on 22 Nov, so that place is probably filled. The email asks about other places in the network.", "match": 10, "chance": 5, "to_hint": "Assoc. Prof. Olga Saukh (address on https://tugraz.at/arbeitsgruppen/iti-teams/elss)", "subject": "Prospective PhD student in embedded machine learning (MSc Sharif University)", "body": "Dear Prof. Saukh,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I would like to ask whether there is still a PhD place in your Embedded Learning and Sensing Systems group, for example in the MSCA Doctoral Network \"Embedded AI Systems and Applications\" or in another project.\n\nRunning deep learning on very constrained devices with attention to energy and privacy is exactly what my MSc thesis did. I built a voice assistant for older adults that keeps all listening on the device. I designed a 75k-parameter wake-word model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi, with the full pipeline in C++ and TFLite. Under five-fold cross-validation it beat DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute on every fold, and int8 conversion cost 0.1 points or less. In deployment the device microphone tripled false alarms while AUC barely moved, and retraining on hard negatives recorded on the device cut false activations from 60 to 3 in a 388-hour test.\n\nThe work has produced a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I also work as an embedded and ML systems engineer, so I can take a model from training all the way to firmware. I have never lived in Austria, so I meet the MSCA mobility rule.\n\nMy CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "beigl", "batch": 1, "country": "Germany", "who": "Prof. Michael Beigl", "where": "KIT Karlsruhe", "why": "Open salaried PhD job, tiny AI for wearable health.", "kind": "Apply by email", "hot": true, "page": "https://www.teco.kit.edu/", "email": "email_beigl.txt", "note": "His address is on the TECO website.", "match": 9, "chance": 6, "to_hint": "(Prof. Beigl's address from https://www.teco.kit.edu/)", "subject": "Application, PhD position in Wearable Computing in Health Technologies (tiny AI)", "body": "Dear Prof. Beigl,\n\nI would like to apply for the PhD position in Wearable Computing in Health Technologies advertised on the TECO website, and I would be grateful if you could confirm that it is still open. The toolchain position also interests me.\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology. My thesis is a home device for older adults that listens for a wake word and detects falls. I designed a 75k-parameter wake-word model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi, with the whole stack in C++ and TFLite. The model beat DS-CNN, TC-ResNet8, BC-ResNet and size-matched and compute-matched baselines on every fold of a five-fold cross-validation. Retraining on hard negatives recorded through the device microphone cut false activations from 60 to 3 in a 388-hour streaming test, and the device ran for five weeks in two real rooms with no false activations in everyday use.\n\nYour group's work on on-device activity recognition and on earable physiological sensing is close to what I want to do next, tiny AI for health sensing that runs on the device and is tested with real users. I have shipped this kind of system end to end, from sensor and firmware to model and app.\n\nMy CV, transcripts and a motivation letter can follow immediately. My German is intermediate and I am working towards B1. Papers: system paper accepted at ICBME 2026 (IEEE), compact-model paper submitted to ICEE 2027, journal paper submitted to IEEE Sensors Journal. Code at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nmge.goat@gmail.com"}, {"id": "saeed", "batch": 1, "country": "Netherlands", "who": "Dr. Aaqib Saeed", "where": "TU Eindhoven", "why": "Audio for health on personal devices, his grant pays for 5 PhDs.", "kind": "Email", "page": "https://tue.nl/en/research/researchers/aaqib-saeed", "email": "email_saeed.txt", "match": 9, "chance": 4, "to_hint": "Dr. Aaqib Saeed (address on https://tue.nl/en/research/researchers/aaqib-saeed)", "subject": "Prospective PhD student in audio understanding for health (MSc Sharif University)", "body": "Dear Dr. Saeed,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I would like to ask whether there is a PhD position in your group, for example within your AiNed project on clinical audio understanding.\n\nYour work on audio for personal health and on decentralized, on-device learning is very close to my thesis. I built a voice assistant for older adults that listens on the device and sends nothing until a wake word fires. I designed a 75k-parameter wake-word model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi. Under five-fold cross-validation on held-out recordings and unseen speakers it was the most accurate model on every fold against DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute. In deployment the device microphone tripled false alarms while AUC barely moved, and retraining on hard negatives recorded on the device cut false activations from 60 to 3 in a 388-hour test.\n\nThis work has produced a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I also work as an embedded and ML systems engineer and on production LLM agents, so I am comfortable with both the model and the device side of health audio.\n\nIf you have an opening now or expect one, I would be glad to apply. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "devries", "batch": 1, "country": "Netherlands", "who": "Prof. Bert de Vries", "where": "TU Eindhoven", "why": "Hearing aids that adapt to the user.", "kind": "Email", "page": "https://tue.nl/onderzoek/research-groups/signal-processing-systems/biaslab", "email": "email_devries.txt", "address": "bert.de.vries@tue.nl", "match": 8, "chance": 4, "to_hint": "Prof. Bert de Vries (bert.de.vries@tue.nl)", "subject": "Prospective PhD student in personalised hearing and audio systems (MSc Sharif University)", "body": "Dear Prof. de Vries,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I would like to ask whether you expect a PhD position in BIASlab in the coming year.\n\nYour work on Bayesian hearing agents that personalise audio processing in the field, such as AIDA, speaks to a problem I met in my own thesis. I built an always-on voice assistant for older adults with a 75k-parameter wake-word model that runs in int8 on a Raspberry Pi. It was the most accurate model on every fold of a five-fold cross-validation against DS-CNN, TC-ResNet8, BC-ResNet and size-matched and compute-matched baselines. But once it ran on the real device, the microphone tripled false alarms while AUC barely moved, and only retraining on sounds recorded on that device fixed it, from 60 false activations to 3 in a 388-hour test. Adapting an audio system to its user and device after deployment, instead of retraining offline, is what I would like to work on.\n\nThe work has produced a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I also work as an embedded and ML systems engineer.\n\nIf a funded position might open, I would be glad to apply. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "mueller", "batch": 1, "country": "Austria", "who": "Prof. Daniel Müller-Gritschneder", "where": "TU Wien", "why": "TinyML and ML compilers, has a funded edge-AI project.", "kind": "Email", "page": "https://informatics.tuwien.ac.at/people/daniel-mueller-gritschneder", "email": "email_mueller_gritschneder.txt", "match": 9, "chance": 5, "to_hint": "Prof. Daniel Müller-Gritschneder (address on https://informatics.tuwien.ac.at/people/daniel-mueller-gritschneder)", "subject": "Prospective PhD student in TinyML and embedded ML (MSc Sharif University)", "body": "Dear Prof. Müller-Gritschneder,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I would like to ask whether you have a funded PhD position in Embedded Computing Systems, for example within the DOMINO project on a green and safe edge AI lifecycle.\n\nYour group's work on tinyML, ML compilers and NAS for tiny devices matches what I have been building. My thesis is an always-on voice assistant for older adults. I designed a 75k-parameter wake-word model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi with C++ and TFLite. Under five-fold cross-validation it beat DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute on every fold. I also measured what happens after deployment, where the device microphone tripled false alarms while AUC barely moved, and retraining on device-recorded hard negatives cut false activations from 60 to 3 in a 388-hour test. Keeping an edge model correct and efficient through its life on the device is the part I want to study.\n\nThe work has led to a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I work as an embedded and ML systems engineer as well.\n\nIf there is an opening now or later in 2027, I would be glad to apply. My CV is attached and my code is at github.com/MGE-GOAT. My German is intermediate.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "jku", "batch": 1, "country": "Austria", "who": "LIT AI Lab", "where": "JKU Linz", "why": "Deep learning lab that takes PhD applications by email. Its last advertised call closed in August, so this is an open enquiry.", "kind": "Email", "page": "https://jku.at/en/lit-artificial-intelligence-lab/career/", "email": "email_jku.txt", "address": "recruiting@ai-lab.jku.at", "match": 7, "chance": 4, "to_hint": "recruiting@ai-lab.jku.at", "subject": "ML-PhD application, Mahrad Ghazli (MSc Sharif University)", "body": "Dear LIT AI Lab team,\n\nI would like to apply for an ML-PhD candidate position at the LIT AI Lab. I saw the Robust AI call with positions in agentic AI and world-model-based agents. I understand its listed deadline has passed, so I would be grateful to know whether these or other PhD positions in the lab are still open.\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology. I have worked on both sides of the call topics. As an applied AI scientist I build production LLM agents with tool use, retrieval and memory, including a data-analysis agent in which code computes every figure and rejects numbers the model writes itself. As an embedded ML engineer I designed a 75k-parameter wake-word model that runs in int8 on a Raspberry Pi and beat DS-CNN, TC-ResNet8, BC-ResNet and size-matched and compute-matched baselines on every fold of a five-fold cross-validation.\n\nMy research so far includes a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper on microphone-induced degradation submitted to IEEE Sensors Journal.\n\nMy CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nmge.goat@gmail.com"}, {"id": "vanlaerhoven", "batch": 1, "country": "Germany", "who": "Prof. Kristof Van Laerhoven", "where": "University of Siegen", "why": "Wearables and on-body audio, already supervises an Iranian PhD student.", "kind": "Email", "page": "https://ubi29.informatik.uni-siegen.de/usi/", "email": "email_vanlaerhoven.txt", "match": 9, "chance": 6, "to_hint": "Prof. Kristof Van Laerhoven (address on https://ubi29.informatik.uni-siegen.de/usi/)", "subject": "Prospective PhD student in on-body audio and low-bit models (MSc Sharif University)", "body": "Dear Prof. Van Laerhoven,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I would like to ask whether you have or expect a funded PhD position in your Ubiquitous Computing group. I would also be grateful to know whether the doctorate would be a Dr.-Ing. or a Dr. rer. nat.\n\nYour group's recent work on learnable low-bit quantization and on on-body acoustic event detection is very close to mine. I built a home device for older adults that listens for a wake word on the device. I designed a 75k-parameter model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi. Under five-fold cross-validation it beat DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute on every fold. In deployment I found that the microphone itself changes the false-alarm rate while AUC barely moves, and retraining on hard negatives recorded on the device cut false activations from 60 to 3 in a 388-hour test. Models trained on audio from one set of microphones and used on another is a problem your audio work will meet as well.\n\nThe work has led to a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I build and field-deploy my own hardware and datasets, which I understand your group does too.\n\nMy CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "meyer", "batch": 1, "country": "Germany", "who": "Prof. Bernd Meyer", "where": "University of Oldenburg", "why": "Speech and keyword spotting for hearing research.", "kind": "Email", "page": "https://www.uol.de/en/communication-acoustics", "email": "email_meyer.txt", "match": 9, "chance": 5, "to_hint": "(Prof. Meyer's address from https://www.uol.de/en/communication-acoustics)", "subject": "Prospective PhD student in keyword spotting and speech processing (MSc Sharif University)", "body": "Dear Prof. Meyer,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology and I am writing to ask whether you expect an open PhD position in your group, for example through Hearing4all or a project grant.\n\nYour work on multilingual query-by-example keyword spotting and on speech processing for hearing research is close to my thesis. I built an always-on Persian wake-word system for older adults with a 75k-parameter model that runs in int8 on a Raspberry Pi. Under five-fold cross-validation on held-out recordings and unseen speakers it was the most accurate model on every fold against DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute. In deployment I found that the device microphone tripled false alarms while AUC barely moved, and retraining on device-recorded hard negatives cut false activations from 60 to 3 in a 388-hour test.\n\nThe work has led to a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I also work as an embedded and ML systems engineer.\n\nIf there is a chance of a funded position in the coming year, I would be glad to send anything you need. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "pernkopf", "batch": 1, "country": "Austria", "who": "Prof. Franz Pernkopf", "where": "TU Graz", "why": "Professor for intelligent systems, speech and edge AI, active in 2026.", "kind": "Email", "page": "https://www.spsc.tugraz.at/people/franz-pernkopf", "email": "email_pernkopf.txt", "match": 7, "chance": 4, "to_hint": "Prof. Franz Pernkopf (CHECK FIRST that he still leads the group on https://www.spsc.tugraz.at/ and copy his address from there)", "subject": "Prospective PhD student in efficient speech and audio ML (MSc Sharif University)", "body": "Dear Prof. Pernkopf,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I am writing to ask whether you expect a PhD position in your group in the coming year.\n\nMy thesis is an always-on wake-word system for older adults. I designed a 75k-parameter model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi. Under five-fold cross-validation on held-out recordings and unseen speakers it was the most accurate model on every fold against DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute. In deployment the device microphone tripled false alarms while AUC barely moved, and retraining on device-recorded hard negatives cut false activations from 60 to 3 in a 388-hour test. Resource-efficient speech models and their robustness on real devices are what I would like to work on next, which is why your group is my first choice in Graz.\n\nThe work has led to a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I also work as an embedded and ML systems engineer.\n\nIf a funded position might open, I would be glad to apply. My CV is attached and my code is at github.com/MGE-GOAT. My German is intermediate.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "ista", "batch": 1, "country": "Austria", "who": "ISTA PhD programme", "where": "Klosterneuburg, near Vienna", "why": "Fully funded PhD, no fees, start 15 Sep 2027. Name Prof. Dan Alistarh's group.", "kind": "Apply online", "deadline": "2027-01-08", "page": "https://phd.ista.ac.at/phd-application-admission/", "note": "Ask Dr. Mohammadzadeh for a reference letter now, letters are due 12 Jan.", "match": 8, "chance": 3}, {"id": "knowcenter", "batch": 2, "country": "Austria", "who": "Know Center (IACAI, 6 PhD places)", "where": "Graz, PhD at TU Graz", "why": "Agentic AI PhDs, including energy-efficient agents. Your LLM-agent job plus edge ML fits better than most applicants.", "kind": "Apply by email", "hot": true, "page": "https://www.know-center.at/wp-content/uploads/2025/10/IACAI-Stellenausschreibung-PhD-Researcher_EN.pdf", "email": "email_knowcenter.txt", "address": "career@know-center.at", "note": "Posted Oct 2025, some places are filled, the email asks which are still open.", "match": 8, "chance": 6, "to_hint": "career@know-center.at", "subject": "Application, Researcher PhD Candidate in agentic AI (IACAI), energy-efficient agentic AI", "body": "Dear Know Center team,\n\nI would like to apply for a Researcher PhD Candidate position in the IACAI project, and I would be grateful to know which of the research directions are still open. My first preference is energy-efficient agentic AI and my second is reasoning in multi-agent AI.\n\nI bring both halves of the first direction. As an applied AI scientist I build production LLM agents with tool use, retrieval and memory, including a data-analysis agent in which code computes every figure and rejects numbers the model writes itself, which cut one task from 12 model calls to 2. As an embedded ML engineer I make models small and fast. My thesis is an always-on voice assistant for older adults. I designed a 75k-parameter wake-word model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi. Under five-fold cross-validation on held-out recordings and unseen speakers it was the most accurate model on every fold against DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute. In deployment the device microphone tripled false alarms while AUC barely moved, and retraining on hard negatives recorded on the device cut false activations from 60 to 3 in a 388-hour test.\n\nThis work has produced a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I also work as an embedded and ML systems engineer. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nmge.goat@gmail.com"}, {"id": "hoogantink", "batch": 2, "country": "Germany", "who": "Prof. Christoph Hoog Antink", "where": "TU Darmstadt, KIS*MED", "why": "Biomedical signal quality, engineering doctorate (Dr.-Ing.), easy subject match for a BME degree.", "kind": "Email", "page": "https://www.etit.tu-darmstadt.de/kismed/", "email": "email_hoogantink.txt", "match": 8, "chance": 5, "to_hint": "Prof. Christoph Hoog Antink (address on https://www.etit.tu-darmstadt.de/kismed/)", "subject": "Prospective PhD student in biomedical signal quality and embedded ML (MSc Sharif University)", "body": "Dear Prof. Hoog Antink,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I would like to ask whether you expect a funded PhD position in KIS*MED.\n\nYour work on signal quality for medical time series, and the point that acquisition-side properties often matter more than the algorithm, is what my own thesis ran into. My thesis is an always-on voice assistant for older adults. I designed a 75k-parameter wake-word model, trained it with int8 quantization-aware training and run it in real time on a Raspberry Pi. Under five-fold cross-validation on held-out recordings and unseen speakers it was the most accurate model on every fold against DS-CNN, TC-ResNet8, BC-ResNet and DS-CNNs matched to its size and compute. In deployment the device microphone tripled false alarms while AUC barely moved, and retraining on hard negatives recorded on the device cut false activations from 60 to 3 in a 388-hour test. The microphone, not the model, was the problem, and the usual summary metric did not show it.\n\nThis work has produced a system paper accepted at ICBME 2026 (IEEE), a compact-model paper submitted to ICEE 2027 and a journal paper submitted to IEEE Sensors Journal. I also work as an embedded and ML systems engineer. My CV is attached and my code is at github.com/MGE-GOAT.\n\nIf a position might open, I would be glad to apply.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "karlen", "batch": 2, "country": "Germany", "who": "Prof. Walter Karlen", "where": "Ulm University, Biomedical Engineering", "why": "Intelligent mobile health sensors, institute was hiring in summer 2026.", "kind": "Email", "page": "https://www.uni-ulm.de/en/in/bmt/institute/open-positions/", "email": "email_karlen.txt", "match": 8, "chance": 6, "to_hint": "Prof. Walter Karlen (address on https://www.uni-ulm.de/en/in/bmt/)", "subject": "Prospective PhD student in intelligent mobile sensors (MSc Sharif University)", "body": "Dear Prof. Karlen,\n\nI am finishing my MSc in Biomedical Engineering at Sharif University of Technology, and I would like to ask whether you have or expect a funded PhD position in your group at the Institute of Biomedical Engineering.\n\nYour work on intelligent mobile function planView(){

  let h=`<section class="next">${next?`<small>Your next step</small><h2>${esc(next.kind==="Apply online"?"Apply to":"Email")} ${esc(next.who)}, ${esc(next.where)}</h2><p>${esc(next.why)}</p>`
    :`<small>Batch done</small><h2>All sent. Now wait for replies.</h2><p>When someone answers, paste it to Claude and it will write your reply. If nobody answers in 10 days, ask Claude for follow-ups and batch 2.</p>`}</section>
  <div class="bar"><i style="width:${steps.length?100*done/steps.length:0}%"></i></div><div class="count">${done} of ${steps.length} done</div>
  <div class="how"><b>How each email works</b><ol>
   <li>Press <b>Open in Gmail</b>. The subject and text are filled in for you.</li>
   <li>Press <b>Professor's page</b> and copy their email address into the "To" box (it is filled already when we know it).</li>
   <li>Attach your CV, <code>Mahrad_Ghazli_Academic_CV_2026-11-13.pdf</code>.</li>
   <li>Send, then press <b>Mark as sent</b> here.</li></ol>
   <div class="visa" style="margin-top:8px">Send 2 or 3 a day, in the morning Europe time. Orange ones are real open PhD positions, do those first.<br><b>Match</b> is how close their research is to yours. <b>Chance</b> is a rough guess of getting a positive reply, based on competition and whether they have money now. Ten emails at chance 5 usually give two or three real conversations.</div></div>
`;
  let lastBatch=0;
  steps.forEach((st,i)=>{
    if(st.batch!==lastBatch){lastBatch=st.batch;h+=`<h3>${({1:"Batch 1, this week",2:"Batch 2, next week (easier places, more chances)",3:"Batch 3, the week after (broad list, send 3 to 5 a day)"})[st.batch]}</h3>`}

    h+=`<article class="step ${st.hot?"hot":""} ${isDone?"done":""}"><div class="num">${isDone?"✓":i+1}</div><div>
      <div class="who">${esc(st.who)}</div><div class="where">${esc(st.where)}, ${esc(st.country)}</div>
      <div class="tags">${st.hot?`<span class="tag hot">Open position</span>`:""}${st.match?`<span class="tag score">Match ${st.match}/10</span><span class="tag score">Chance ${st.chance}/10</span>`:""}<span class="tag">${esc(st.kind)}</span>${dl}</div>
      <div class="why">${esc(st.why)}</div>${st.note?`<div class="note">${esc(st.note)}</div>`:""}
      <div class="actions">
        ${st.body?`<a class="btn main" href="${gmail(st)}" target="_blank" rel="noopener">Open in Gmail</a><button class="btn" data-copy="${st.id}">Copy email text</button>`
          :`<a class="btn main" href="${esc(st.page)}" target="_blank" rel="noopener">Open application</a>`}
        ${st.body?`<a class="btn" href="${esc(st.page)}" target="_blank" rel="noopener">Professor's page</a>`:""}
        <button class="btn ${isDone?"ok":""}" data-sent="${st.id}">${isDone?"Sent ✓":"Mark as sent"}</button>
      </div>
      ${st.body?`<details class="preview"><summary>Read the email</summary><pre>Subject: ${esc(st.subject)}\n\n${esc(st.body)}</pre></details>`:""}
    </div></article>`;
  });
  h+=`<h3>Visa, in one line each</h3><div class="how visa"><b>Austria</b> is the easiest, you can file via Istanbul. <b>Germany</b>, register on the embassy waitlist as soon as you have any offer. <b>Netherlands</b>, the entry visa for Iranians was suspended in August, ask the university early.</div>`;
  return h;
}

function render(){

}

$("#foot").textContent="Your 'sent' ticks are saved in this browser only. Tell Claude who you emailed so the plan stays up to date.";
$("#tabs").onclick=e=>{if(!e.target.dataset.t)return;tab=e.target.dataset.t;[...$("#tabs").children].forEach(b=>b.classList.toggle("on",b===e.target));render()};
render();
</script>
</body>
