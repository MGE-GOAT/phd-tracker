<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhD Plan</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#141c26;--muted:#5c6a79;--line:#dfe4ea;--accent:#16707b;--accent-ink:#fff;--accent-soft:#e2f1f2;
--hot:#a4570a;--hot-soft:#fdf0df;--done:#1f7a3f;--done-soft:#e4f4e9;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131a;--card:#161d26;--ink:#e7ecf1;--muted:#93a2b2;--line:#28323e;
--accent:#56c0cc;--accent-ink:#06262a;--accent-soft:#143238;--hot:#f2ab5d;--hot-soft:#3a2a16;--done:#7fd69a;--done-soft:#163222;--chip:#212b36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:auto;padding:0 16px}
header{padding:30px 0 6px}
h1{margin:0;font-size:28px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.next{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px 22px;margin:14px 0 8px}
.next small{opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600}
.next h2{margin:4px 0 6px;font-size:22px}
.next p{margin:0;opacity:.92}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 6px}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.count{color:var(--muted);font-size:14px}
.how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:14px 0}
.how ol{margin:6px 0 0;padding-left:20px}
.how li{margin:3px 0}
h3{margin:26px 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:16px 18px;display:grid;grid-template-columns:38px 1fr;gap:4px 12px}
.step.hot{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot) inset}
.step.done{opacity:.62}
.num{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px}
.step.done .num{background:var(--done-soft);color:var(--done)}
.who{font-weight:700;font-size:17px}
.where{color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.tag.hot{background:var(--hot-soft);color:var(--hot);font-weight:600}
.tag.score{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.country{font-weight:600}
.tag.dl{background:var(--hot-soft);color:var(--hot)}
.why{margin:2px 0 4px}
.note{font-size:14px;color:var(--hot);margin:4px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-size:14px;border-radius:10px;padding:8px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--done-soft);border-color:var(--done-soft);color:var(--done);font-weight:600}
details.preview{margin-top:10px}
details.preview summary{cursor:pointer;color:var(--muted);font-size:14px}
pre{white-space:pre-wrap;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.visa{font-size:14px;color:var(--muted)}
.visa b{color:var(--ink)}
/* copy-paste kit page */
.kf{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.kf label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.kf input,.kf textarea{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.kf textarea{resize:vertical;line-height:1.5}
.kact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cnt{font-weight:400;color:var(--muted);font-size:13px}
.cnt.over{color:#b3261e;font-weight:700}
.m{color:var(--muted);font-size:13px}
a.whol{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;cursor:pointer}
.fl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line)}
.fl:last-child{border-bottom:0}
.fl b{min-width:150px}
/* database view */
.dbbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.dbbar input,.dbbar select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.dbbar input{flex:1;min-width:160px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:11px 14px;font-size:14px}
.item b{font-size:15px}
.item .m{color:var(--muted)}
.item details summary{cursor:pointer;color:var(--accent);margin-top:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
a{color:var(--accent)}
footer{color:var(--muted);font-size:13px;margin:30px 0 40px}
@media (max-width:560px){.step{grid-template-columns:1fr}.num{display:none}}
</style>
</head>
<body>

<header>
  <h1>PhD Plan</h1>
  <div class="sub" id="sub"></div>
  <nav id="tabs">
    <button data-t="plan" class="on">What to do</button>
    <button data-t="db">All positions</button>
    <button data-t="countries">Countries</button>
  </nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>

tion", "verified": "2026-11-23", "competition": "Medium", "to_hint": "Ulm University job portal (questions to Prof. Dr. Fabian Just, fabian.just@uni-ulm.de)", "subject": "Cover letter, Doctoral student, Wearable Knee Orthosis for Personalized Rehabilitation", "body": "Dear Prof. Just,\n\nI am applying for the doctoral position on the wearable knee orthosis for personalized rehabilitation at the Institute of Biomedical Engineering. I am finishing my MSc in Biomedical Engineering at Sharif University of Technology. My thesis was a health device that has to work every day in people's homes, which is the problem your project describes. Most recovery after knee surgery happens at home without anyone watching, so the system has to run reliably there. Your recent work on sensorizing and motorizing a commercial knee orthosis with ROS2, and on EMG-based detection of movement effort, is the kind of system I would like to build with you.\n\nFor my thesis I built Noban, an always-on voice assistant for older adults who live alone, and I took it from an idea to a working device. It runs on a Raspberry Pi with a MEMS microphone, an OLED display, status LEDs and Bluetooth Low Energy pairing. The pipeline is written in C++ with TensorFlow Lite and runs as system services with automatic recovery, so it keeps working without anyone touching it. A server and a Flutter app for caregivers handle alerts, pill reminders and calls, and the device also runs a camera-based fall detector.\n\nThe most useful lesson came from real use. A model that looked good offline behaved differently on the device's own sensor, so I recorded data on the device and retrained. I expect the same gap between lab data and daily life in movement data from an orthosis, and I know how to measure it and close it.\n\nMy thesis led to three papers. One is accepted at ICBME 2026, one is submitted to the IEEE Sensors Journal and one to ICEE 2027. I also work as an embedded and ML systems engineer, writing firmware and Linux services in C and C++, and I am at home with hands-on electronics. My strongest side is software and signal processing, and I would bring that to the orthosis while I learn the PCB design your compact sensor electronics need.\n\nI care about the clinical side of this project. My device was built for older adults and their caregivers, and it taught me that a system only matters if patients and staff really use it. I would be glad to run usability and clinical studies with patients and therapists. My German is at an intermediate level, and I can reach B1 within the first year as the position asks.\n\nMy CV, transcripts and code (github.com/MGE-GOAT) are attached. Thank you for considering my application.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "mcml", "batch": 1, "country": "Germany", "who": "MCML PhD call 2027", "where": "LMU Munich and TU Munich", "why": "One application, matched with a machine learning professor in Munich. Pick professors who work on efficient or on-device ML or on health data.", "kind": "Apply online", "deadline": "2026-12-07", "page": "https://www.portal.graduatecenter.lmu.de/ocgc/mcml", "match": 6, "chance": 3, "note": "Long shot, very competitive. The portal closes at 09:00 Munich time, not midnight.", "approved": "A", "verified": "2026-11-23", "competition": "High"}, {"id": "csmaxplanck", "batch": 1, "country": "Germany", "who": "CS@max planck doctoral program", "where": "Max Planck institutes with Saarland, Tübingen and Stuttgart", "why": "One application for many computer science groups at the Max Planck institutes in Saarbrücken and partner universities.", "kind": "Apply online", "deadline": "2026-12-15", "page": "https://www.cis.mpg.de/cs-max-planck", "match": 6, "chance": 3, "note": "The Max Planck institutes give no degree. The degree comes from a partner university the program page does not name. Saarland University is group C on the approved list. Ask the program office which university would give your degree before applying. Long shot. References are only asked after a first review.", "approved": "ask which university gives the degree (Saarland is C)", "verified": "2026-11-23", "competition": "High"}, {"id": "acta_su", "batch": 2, "country": "Netherlands", "who": "Dr. Naichuan Su", "where": "ACTA, Vrije Universiteit Amsterdam", "why": "Open PhD in the EU project MYDIAG.AI. Build and clinically validate AI that screens for heart disease and diabetes from dental and health records. 4 years, €3,204 to €4,051 a month.", "kind": "Apply online", "deadline": "2027-03-01", "page": "https://www.academictransfer.com/en/jobs/365626/phd-ai-for-early-detection-of-cardiometabolic-diseases-using-oral-health-data/", "email": "cover_acta_su.txt", "match": 6, "chance": 5, "note": "Reviewed on a rolling basis, so apply in December, not March. Emailed applications are not considered.", "approved": "A", "latest": "randomised trials of AI in oral healthcare, oral health screening tools", "verified": "2026-11-23", "competition": "Medium", "to_hint": "VU Amsterdam application portal (questions only to Dr. Naichuan Su, n.su@acta.nl)", "subject": "Cover letter, PhD AI for early detection of cardiometabolic diseases using oral health data", "body": "Dear Dr. Su,\n\nI am applying for the PhD position on AI for early detection of cardiometabolic diseases using oral health data, in the MYDIAG.AI project at ACTA. I am finishing my MSc in Biomedical Engineering at Sharif University of Technology. I want to build health AI that is validated properly and then used in care, and your project asks for exactly that.\n\nMy thesis was a complete health system for older adults, an always-on voice assistant with a caregiver app. I designed its wake-word model and ran it in real time on a Raspberry Pi. I validated it carefully against several baselines and then tested it in real use. There the microphone changed how the system behaved in a way the off ld email.", "competition": "Medium", "to_hint": "Prof. Philipp Rostalski <philipp.rostalski@imte.fraunhofer.de>", "subject": "Prospective PhD student in real-time biosignal processing for medical devices (MSc Sharif University)", "body": "Dear Prof. Rostalski,\n\nI am finishing an MSc in Biomedical Engineering at Sharif University of Technology and I am looking for a funded PhD position. I came across your recent work on real-time classification of patient-ventilator interaction from surface EMG. It combines real-time signal processing with a clinical problem, which is what I want to work on.\n\nMy thesis is an always-on voice assistant for older adults, with a 75k-parameter int8 model that runs in real time on a Raspberry Pi.\n\nDo you have or expect a funded PhD position in your group? My German is intermediate. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "vonluhmann", "batch": 1, "country": "Germany", "who": "Prof. Alexander von Lühmann", "where": "TU Berlin and BIFOLD, Intelligent Biomedical Sensing lab", "why": "Wearable brain sensing with machine learning, the lab has an ERC grant.", "kind": "Email", "page": "", "email": "email_vonluhmann.txt", "address": "vonluehmann@tu-berlin.de", "match": 8, "chance": 4, "approved": "A", "latest": "wearable fNIRS and attention decoding, DOT reconstruction, wearable neurotech", "verified": "2026-11-23", "note": "Biomedical engineering fit. No advert is open, this is a cold email.", "competition": "High", "to_hint": "Prof. Alexander von Lühmann <vonluehmann@tu-berlin.de>", "subject": "Prospective PhD student in wearable neurotechnology and machine learning (MSc Sharif University)", "body": "Dear Prof. von Lühmann,\n\nI am finishing an MSc in Biomedical Engineering at Sharif University of Technology and I am looking for a funded PhD position. I came across your recent work on decoding spatial attention with high-density fNIRS. Wearable brain sensing for assistive devices is the direction I want to work in.\n\nMy thesis is an always-on voice assistant for older adults, with a 75k-parameter int8 model that runs in real time on a Raspberry Pi.\n\nDo you have or expect a funded PhD position in your group? My German is intermediate. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "deserno", "batch": 1, "country": "Germany", "who": "Prof. Thomas Deserno", "where": "TU Braunschweig, Peter L. Reichertz Institute for Medical Informatics", "why": "Unobtrusive sensing for health, multimodal signals and clinical informatics.", "kind": "Email", "page": "", "email": "email_deserno.txt", "address": "thomas.deserno@plri.de", "match": 7, "chance": 5, "approved": "A", "latest": "in-vehicle heartbeat detection from ECG, PPG and camera, early warning scores", "verified": "2026-11-23", "note": "Biomedical engineering fit. No advert is open, this is a cold email.", "competition": "Low", "to_hint": "Prof. Thomas Deserno <thomas.deserno@plri.de>", "subject": "Prospective PhD student in unobtrusive health sensing and machine learning (MSc Sharif University)", "body": "Dear Prof. Deserno,\n\nI am finishing an MSc in Biomedical Engineering at Sharif University of Technology and I am looking for a funded PhD position. I came across your recent work on reliable heartbeat detection from steering wheel ECG, PPG and a camera. Getting dependable signals from unobtrusive sensors is close to my thesis, where the microphone mattered more than the model.\n\nMy thesis is an always-on voice assistant for older adults, with a 75k-parameter int8 model that runs in real time on a Raspberry Pi.\n\nDo you have or expect a funded PhD position in your group? My German is intermediate. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "mertins", "batch": 1, "country": "Germany", "who": "Prof. Alfred Mertins", "where": "University of Lübeck, Institute for Signal Processing", "why": "EEG-based hearing aid research at the Institute for Signal Processing.", "kind": "Email", "page": "", "email": "email_mertins.txt", "address": "alfred.mertins@uni-luebeck.de", "match": 6, "chance": 4, "approved": "B", "latest": "auditory attention decoding from EEG, hearing aid testing in virtual scenes", "verified": "2026-11-23", "note": "Biomedical engineering fit. No advert is open, this is a cold email.", "competition": "Low", "to_hint": "Prof. Alfred Mertins <alfred.mertins@uni-luebeck.de>", "subject": "Prospective PhD student in EEG, hearing aids and signal processing (MSc Sharif University)", "body": "Dear Prof. Mertins,\n\nI am finishing an MSc in Biomedical Engineering at Sharif University of Technology and I am looking for a funded PhD position. I came across your recent work on auditory attention decoding from EEG for hearing aids with a scattering transform. I work on speech and audio models, and I would like to combine that with EEG.\n\nMy thesis is an always-on voice assistant for older adults, with a 75k-parameter int8 model that runs in real time on a Raspberry Pi.\n\nDo you have or expect a funded PhD position in your group? My German is intermediate. My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "uis_har", "batch": 1, "country": "Norway", "who": "PhD Fellow, Lifelong ML for Human Activity Recognition", "where": "University of Stavanger, Electrical Engineering and Computer Science", "why": "Open PhD on activity recognition from wearable and household sensors that keeps learning and protects privacy, in a lab working on smart care. A salaried job, NOK 580,000 a year, 3 to 4 years, from spring 2027.", "kind": "Apply online", "hot": true, "deadline": "2026-12-15", "page": "https://euraxess.ec.europa.eu/jobs/481237", "email": "cover_uis_har.txt", "match": 9, "chance": 5, "approved": "B", "latest": "lifelong and federated learning for activity recognition, the Smart Objects for Smart Care household sensing system", "note": "Apply through the University of Stavanger portal, link on the EURAXESS page. Upload the full master's thesis, CV, transcripts, the 2-page motivation letter and a grade-conversion note. The advert also says English proficiency documentation 'if required', ask rekruttering@uis.no whether your English-free MSc needs a test, and ask early. Grades must convert to B or better.", "verified": "2026-11-23", "competition": "Low", "to_hint": "University of Stavanger recruitment portal (questions to rekruttering@uis.no)", "subject": "Motivation letter, PhD Fellow in Lifelong Machine Learning for Human Activity Recognition", "body": "Dear selection committee,\n\nI am applying for the PhD fellowship in lifelong machine learning for human activity recognition. I completed the requirements for my MSc in Biomedical Engineering at Sharif University of Technology on 23 September 2026.\n\nWhy this position\nMy thesis was a home system for older adults, an always-on voice assistant that runs in real time on a Raspberry Pi and was tested in real rooms. Your group works in the same kind of setting. Smart Objects for Smart Care collects wearable and physiological data in real households, and you ask how a system can keep learning without sending personal data to a central server. That question came straight out of my own work.\n\nHow my qualifications match\nThe most important thing I learned is that a model that scores well offline can fail on real hardware. I recorded difficult cases on the device and retrained, and I learned how to measure this kind of shift and how to design a validation that matches real use. I can ship a model in C++ and Python, and I build tool-using LLM agents as an applied AI scientist. My thesis led to three papers. One is accepted at ICBME 2026, one is submitted to the IEEE Sensors Journal and one to ICEE 2027.\n\nMy research ideas\nMy thesis showed me that a model that works in the lab can fail in a real home. I would like to spend the PhD on three connected questions. How can a device notice that its sensor, its user or its home has changed, without anyone labelling new data? How can it then collect its own difficult cases and adapt without forgetting what it already knows? And if many homes learn together by sharing only model updates, how much accuracy do we give up for the privacy we gain? I do not have the answers yet, but these are the questions I would like to work on.\n\nI have not yet worked on continual or federated learning in depth, and I would like to build that knowledge in your group. My CV, transcripts and master's thesis are in the application. Grades are on the Iranian 0 to 20 scale and I can send a conversion note if you need one.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "hyttinen", "batch": 1, "country": "Finland", "who": "Prof. Jari Hyttinen", "where": "Tampere University, Computational Medicine and BME", "why": "EEG and BME in a mid-size Finnish university, less competitive than the elite programs.", "kind": "Email", "page": "", "email": "email_hyttinen.txt", "address": "jari.hyttinen@tuni.fi", "match": 7, "chance": 5, "approved": "A", "latest": "EEG signatures of brain stimulation, cardiac safety frameworks, micro-CT imaging", "verified": "2026-11-23", "note": "Backup country. Biomedical engineering fit. No advert is open, this is a cold email.", "competition": "Low", "to_hint": "Prof. Jari Hyttinen <jari.hyttinen@tuni.fi>", "subject": "Prospective PhD student in EEG signal processing and machine learning (MSc Sharif University)", "body": "Dear Prof. Hyttinen,\n\nI am finishing an MSc in Biomedical Engineering at Sharif University of Technology and I am looking for a funded PhD position. I came across your recent study on scalp EEG signatures of deep brain stimulation in epilepsy. I would like to work on EEG signal processing and machine learning in a clinical setting.\n\nMy thesis is an always-on voice assistant for older adults, with a 75k-parameter int8 model that runs in real time on a Raspberry Pi.\n\nDo you have or expect a funded PhD position in your group? My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "sandberg", "batch": 1, "country": "Sweden", "who": "Prof. Frida Sandberg", "where": "Lund University, Biomedical Engineering", "why": "ECG signal processing for atrial fibrillation at Lund.", "kind": "Email", "page": "", "email": "email_sandberg.txt", "address": "frida.sandberg@bme.lth.se", "match": 7, "chance": 4, "approved": "A", "latest": "ECG f-wave indices in atrial fibrillation, brief AF in stroke, autonomic responses", "verified": "2026-11-23", "note": "Backup country. Biomedical engineering fit. No advert is open, this is a cold email.", "competition": "Medium", "to_hint": "Prof. Frida Sandberg <frida.sandberg@bme.lth.se>", "subject": "Prospective PhD student in ECG signal processing and machine learning (MSc Sharif University)", "body": "Dear Prof. Sandberg,\n\nI am finishing an MSc in Biomedical Engineering at Sharif University of Technology and I am looking for a funded PhD position. I came across your recent work on ECG-derived f-wave indices for predicting outcomes in atrial fibrillation. I would like to work on ECG signal processing and machine learning for patient monitoring.\n\nMy thesis is an always-on voice assistant for older adults, with a 75k-parameter int8 model that runs in real time on a Raspberry Pi.\n\nDo you have or expect a funded PhD position in your group? My CV is attached and my code is at github.com/MGE-GOAT.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "uis_sim", "batch": 1, "country": "Norway", "who": "PhD Fellow, Signal Processing for Medical Simulation", "where": "University of Stavanger, Electrical Engineering and Computer Science", "why": "Open PhD on a cardiac arrest patient model built from real resuscitation recordings, with Laerdal Medical. Signal processing and statistics, a salaried job, NOK 580,000 a year, from spring 2027.", "kind": "Apply online", "hot": true, "deadline": "2026-12-11", "page": "https://euraxess.ec.europa.eu/jobs/481914", "email": "cover_uis_sim.txt", "match": 8, "chance": 6, "approved": "B", "latest": "cardiac arrest physiology simulation, signal processing and statistical models of rhythm transitions", "note": "Same documents as the other Stavanger post. Master's grades must convert to B or better. Ask rekruttering@uis.no early whether an English proficiency document is needed. Do not apply to both on the same day without a different letter, the two letters are already different.", "verified": "2026-11-23", "competition": "Low", "to_hint": "University of Stavanger recruitment portal (questions to rekruttering@uis.no)", "subject": "Motivation letter, PhD Fellow in Signal Processing for Medical Simulation", "body": "Dear selection committee,\n\nI am applying for the PhD fellowship in signal processing for medical simulation in the Cardiac Arrest Physiology Simulation project. I completed the requirements for my MSc in Biomedical Engineering, with a bioelectric specialization, at Sharif University of Technology on 23 September 2026.\n\nWhy this position\nI want to do signal processing and statistics on a real medical problem. Your project builds a patient model from real resuscitation recordings, so that training simulators reflect how hard a cardiac arrest really is. That is a clear problem with a direct use, and it will run inside Laerdal's simulators, so the model has to work in real time. Building small models that run reliably on real devices is what my thesis was about.\n\nHow my qualifications match\nMy thesis was an always-on voice assistant for older adults. I designed a compact model that runs in real time on a Raspberry Pi, with a streaming signal processing front end written in C++. Offline scores looked good, but real use showed a gap, and I studied it and retrained on data from the device. I know how to work with noisy recordings, how to separate the effect of the signal from the effect of the model, and how to validate honestly. My thesis led to three papers. One is accepted at ICBME 2026, one is submitted to the IEEE Sensors Journal and one to ICEE 2027.\n\nMy research ideas\nFirst, I would estimate how a rhythm changes from one state to the next, for example from asystole to ventricular fibrillation to a shock, using a model in which the chance of each change depends on measured treatment quality such as compression depth and pauses. Second, I would check this model against held-out recordings and test whether its probabilities are well calibrated. Third, I would keep the model light enough to run in real time inside the simulator and test it there.\n\nI have not yet worked with cardiac arrest recordings or ECG rhythm analysis, and I would like to learn them in a group that has done this for years. My CV, transcripts and master's thesis are in the application. Grades are on the Iranian 0 to 20 scale and I can send a conversion note if you need one.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "kth_wearable", "batch": 1, "country": "Sweden", "who": "Assoc. Prof. Seraina Dual, with Eric Rullman at Karolinska", "where": "KTH Stockholm, Intelligent Heart Technology Lab", "why": "Open PhD on wearable and implantable heart monitoring. The advert lists biosignal processing, embedded systems and physiology, which is the closest match to your thesis.", "kind": "Apply online", "hot": true, "deadline": "2026-11-26", "page": "https://www.kth.se/lediga-jobb/984498?l=en", "email": "cover_kth_wearable.txt", "match": 9, "chance": 4, "approved": "check", "latest": "wearable biofeedback, cardiac-locomotor coupling and physics-informed data science", "note": "Deadline is two days away. This was already in your positions list but never in the plan. Check KTH against the Ministry list before you apply.", "verified": "2026-11-24", "competition": "High", "kit": {"title": "KTH, Wearable Biofeedback Systems for Cardiovascular Health", "intro": "Deadline 26 November. Open the form, then copy each box below into it, from top to bottom. The two questions are optional in the form but worth filling in.", "blocks": [{"heading": "Contact fields", "note": "Type these into the form, top to bottom. Each box has a Copy button.", "fields": [{"label": "First name", "value": "Mahrad"}, {"label": "Surname", "value": "Ghazli"}, {"label": "Address", "hint": "One line", "value": "Flat 16, Block 9, 10th West Street, Mehrabi, North Sazeman Barname, Ayatollah Kashani"}, {"label": "C/O", "value": "", "hint": "Leave blank"}, {"label": "Postal code", "hint": "Ten digits", "value": "1483993969"}, {"label": "City", "value": "Tehran"}, {"label": "Country", "value": "Iran"}, {"label": "Mobile", "hint": "No leading zero. Keep IR (+98) selected in the form.", "value": "9101611521"}]}, {"heading": "Question 1, why this position (500 characters at most)", "fields": [{"label": "Why are you interested in this position and project?", "value": "I want to work on heart signals that matter for patients and make them run on small wearable devices. This project joins biosignal processing, embedded systems and physiology, with real participants and clinicians at Karolinska. My thesis was a small on-device model for older adults, so a wearable for the heart is a natural next step, and I would like to learn the cardiovascular side from a group that has done it for years.", "max": 500, "rows": 6}]}, {"heading": "Question 2, what you can contribute (500 characters at most)", "fields": [{"label": "What can you contribute to the project and the research group?", "value": "I bring embedded and signal processing experience. I built a small real-time model for a Raspberry Pi with a C++ front end, and worked out why it behaved differently on the real device than in testing. I test on unseen data and say where a model fails. I write Python, C++ and PyTorch. My thesis led to three papers, one accepted at ICBME 2026, one submitted to IEEE Sensors Journal and one to ICEE 2027. I have not worked with heart recordings yet and would learn them quickly.", "max": 500, "rows": 6}]}], "files": [{"slot": "Attach a CV (required)", "file": "1_CV_Mahrad_Ghazli.pdf", "note": "your academic CV, with the LinkedIn link"}, {"slot": "Attach a cover letter", "file": "2_Application_letter_KTH.pdf", "note": "one page, or paste the text below with Enter"}, {"slot": "Other files", "file": "3_Paper_ICBME2026_accepted.pdf", "note": "accepted paper"}, {"slot": "Other files", "file": "4_Paper_IEEE_Sensors_Journal_submitted.pdf", "note": "submitted manuscript"}, {"slot": "Other files", "file": "5_Paper_ICEE2027_submitted.pdf", "note": "submitted manuscript"}, {"slot": "Other files", "file": "6_MSc_transcript_English.pdf", "note": "grades, unofficial"}, {"slot": "Other files", "file": "7_BSc_transcript_English_unofficial.pdf", "note": "bachelor grades, unofficial translation"}, {"slot": "Other files", "file": "your Persian degree and transcript scans", "note": "if you have them"}], "filesNote": "On your computer all of these are in Downloads/KTH-upload. The advert asks for certified copies of diplomas and grades. Upload what you have before the deadline, and they will ask if they need more.", "letter": true}, "to_hint": "KTH recruitment portal (questions to Associate Professor Seraina Dual)", "subject": "Application, doctoral student in Wearable Biofeedback Systems for Cardiovascular Health", "body": "Dear selection committee,\n\nI am applying for the doctoral position in wearable biofeedback systems for cardiovascular health in the Intelligent Heart Technology Lab. I completed the requirements for my MSc in Biomedical Engineering, with a bioelectric specialization, at Sharif University of Technology on 23 September 2026.\n\nThe advert combines biosignal processing, embedded systems and physiology, and the first two are what I have worked on. My thesis was an always-on voice assistant for older adults that runs on a small device. I designed the compact model, wrote its real-time signal processing for the device, and studied why a model that works well in testing can behave differently on the hardware it is built for. The thesis led to three papers. One is accepted at ICBME 2026, one is submitted to the IEEE Sensors Journal and one to ICEE 2027.\n\nI have not worked with cardiovascular recordings yet. I would like to bring my experience with small devices and careful testing to your wearable work, and to learn the cardiovascular side from your group. My CV, transcript and papers are in the application.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "basel_ml", "batch": 1, "country": "Switzerland", "who": "Group Analytics and Informatics for Child Health", "where": "University of Basel, Department of Biomedical Engineering", "why": "Open 4-year PhD on machine learning for preterm lung health, using infant lung function, breath and exposure data. Python, PyTorch and careful validation. No medical background needed.", "kind": "Apply online", "hot": true, "deadline": "2026-11-28", "page": "https://euraxess.ec.europa.eu/jobs/476754", "email": "cover_basel_ml.txt", "match": 7, "chance": 5, "approved": "check", "latest": "multimodal machine learning on the Basel-Bern infant lung development cohort", "note": "No contact email is listed, you apply through the website on the advert. Not audio, it is clinical data. Check Basel against the Ministry list first.", "verified": "2026-11-24", "competition": "Medium", "kit": {"title": "Basel, Machine Learning for Preterm Lung Health", "intro": "Deadline 28 November. The Basel form is short, it has two upload boxes and a personal details section. Date of birth, email password and the privacy tick are for you to enter. All files are ready, only the references are still open.", "blocks": [{"heading": "Form fields, top to bottom", "note": "Email and password are yours to type. Use the email you want Basel to answer, and write the password down. Date of birth is not stored here, type it as MM/DD/YYYY.", "fields": [{"label": "First name", "value": "Mahrad"}, {"label": "Last name", "value": "Ghazli"}, {"label": "Title", "value": "Mr.", "hint": "Pick it from the list"}, {"label": "Address", "value": "Flat 16, Block 9, 10th West Street, Mehrabi, North Sazeman Barname, Ayatollah Kashani", "hint": "One line"}, {"label": "Postal code", "value": "1483993969"}, {"label": "City", "value": "Tehran"}, {"label": "Earliest start date", "value": "As soon as possible after visa approval", "hint": "A free text box"}, {"label": "Country or region of residence", "value": "Iran", "hint": "Pick it from the list"}]}, {"heading": "Optional links to paste", "note": "The advert lets you add links to GitHub, your thesis or earlier technical work.", "fields": [{"label": "GitHub", "value": "https://github.com/MGE-GOAT"}, {"label": "Personal site, with the thesis and papers", "value": "https://mge-goat.github.io/"}, {"label": "LinkedIn", "value": "https://www.linkedin.com/in/mahrad-ghazli-679703240"}]}, {"heading": "References, 2 to 3 contacts", "note": "Keep only the people who said yes. Ask each one first, then paste their line into the form or the last page of the single file. Basel only wants contact details, not letters.", "fields": [{"label": "Referee 1, your thesis advisor", "value": "Dr. Hoda Mohammadzadeh, Department of Electrical Engineering, Sharif University of Technology, hoda@sharif.edu", "multiline": true, "rows": 3}, {"label": "Referee 2", "value": "Dr. Bijan Vosoughi Vahdat, Associate Professor, Department of Electrical Engineering, Sharif University of Technology, vahdat@sharif.edu", "multiline": true, "rows": 3, "hint": "Or use Dr. Jahed below, you do not need both"}, {"label": "Referee 3, optional", "value": "Dr. Neda Attaran, Department of Medical Nanotechnology, Applied Biophotonics Research Center, Science and Research Branch, Islamic Azad University, neda.attaran@srbiau.ac.ir", "multiline": true, "rows": 3, "hint": "Knows your bachelor years and the alginate paper"}, {"label": "If someone says no, Dr. Mehran Jahed", "value": "Dr. Mehran Jahed, Associate Professor, Department of Electrical Engineering, Sharif University of Technology, jahed@sharif.edu", "multiline": true, "rows": 3}, {"label": "If someone says no, Dr. Nahid Hassanzadeh Nemati", "value": "Dr. Nahid Hassanzadeh Nemati, Department of Biomedical Engineering, Science and Research Branch, Islamic Azad University, Hasanzadeh@srbiau.ac.ir", "multiline": true, "rows": 3, "hint": "The address has one s in Hasanzadeh, as she published it"}, {"label": "If someone says no, Dr. Hadi Baharifar", "value": "Dr. Hadi Baharifar, Department of Biomedical Engineering, Science and Research Branch, Islamic Azad University, baharifar.h@gmail.com", "multiline": true, "rows": 3}]}], "files": [{"slot": "Resume", "file": "1_CV_Mahrad_Ghazli.pdf", "note": "your academic CV"}, {"slot": "Cover letter, letter of recommendation and degree certificates in a single file", "file": "2_Cover_letter_and_transcripts_SINGLE_FILE.pdf", "note": "cover letter, MSc transcript and BSc transcript in one PDF, 5 pages. Add the references page when you have them"}], "filesNote": "On your computer these are in Downloads/Basel-upload. The BSc transcript in the file is an unofficial English translation of your Azad record, and it says so on its first page. Send the official one later if Basel asks.", "letter": true}, "to_hint": "University of Basel recruitment portal", "subject": "Application, PhD position in Machine Learning for Preterm Lung Health", "body": "Dear selection committee,\n\nI am applying for the PhD position in machine learning for preterm lung health in the Analytics and Informatics for Child Health group. I completed the requirements for my MSc in Biomedical Engineering, with a bioelectric specialization, at Sharif University of Technology on 23 September 2026.\n\nThe advert asks for Python, PyTorch and scikit-learn, careful validation, and interest in small clinical datasets. Validation is what my thesis was about. I built an always-on voice assistant for older adults, compared several models fairly, and studied why a model that scores well in testing can behave differently on real data. That is close to the part of your project that checks results in cohorts from Italy and Australia. I also work as an applied AI scientist writing production Python, and my thesis led to three papers. One is accepted at ICBME 2026, one is submitted to the IEEE Sensors Journal and one to ICEE 2027.\n\nI have not worked with clinical or respiratory data and I would learn it with your group. I would start with the lung function trajectories, comparing a simple baseline with a sequence model on held-out children. My CV and transcripts are in the application.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "umcu_heart_mail", "batch": 1, "country": "Netherlands", "who": "Dr. Veronique Meijborg (write first)", "where": "University Medical Center Utrecht", "why": "Open PhD on cardiac electrical signals during donor-heart perfusion, the RRESHAPE-HTx project. She is the contact person. Ask whether the project builds its own analysis methods.", "kind": "Email", "page": "https://euraxess.ec.europa.eu/jobs/481383", "email": "email_umcu_heart_mail.txt", "address": "V.M.F.Meijborg-2@umcutrecht.nl", "match": 7, "chance": 6, "approved": "A", "note": "The advert shows 17 May 2027 as the end date, so there is no rush. Check that the PhD is enrolled at Utrecht University.", "verified": "2026-11-24", "competition": "Low", "to_hint": "Dr. Veronique Meijborg <V.M.F.Meijborg-2@umcutrecht.nl>", "subject": "Question about the PhD position on cardiac electrophysiology during ex situ heart perfusion", "body": "Dear Dr. Meijborg,\n\nI am finishing an MSc in Biomedical Engineering with a bioelectric specialization at Sharif University of Technology, and I would like to apply for the PhD position in the RRESHAPE-HTx project. Monitoring cardiac electrical function to improve donor-heart preservation is a clear problem with a real clinical use.\n\nMy coursework covered biomedical signal processing and my thesis was an on-device model built on noisy recordings from real hardware. I have not worked with cardiac recordings yet. Does the project involve building our own analysis methods for the electrograms, and would a candidate who learns the cardiac side on the job be considered?\n\nMy CV is attached.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "rwth_eld_mail", "batch": 2, "country": "Germany", "who": "Dr. Jan van den Hurk (write first)", "where": "RWTH Aachen, Chair of Electronic Devices", "why": "Doctoral position that combines physics-based modelling and AI for 2D-material devices. A weak fit, it is device physics. Ask whether a machine learning candidate is considered.", "kind": "Email", "deadline": "2026-12-31", "page": "https://euraxess.ec.europa.eu/jobs/478640", "email": "email_rwth_eld_mail.txt", "address": "jan.vandenhurk@eld.rwth-aachen.de", "match": 2, "chance": 3, "approved": "A", "verified": "2026-11-24", "competition": "High", "note": "Closed. It was outside your field (device physics), so this was expected.", "reply": "Dr. van den Hurk answered \"the short answer is: no.\" No reply needed.", "to_hint": "Dr. Jan van den Hurk <jan.vandenhurk@eld.rwth-aachen.de>", "subject": "Question about the doctoral researcher position at the Chair of Electronic Devices", "body": "Dear Dr. van den Hurk,\n\nI am finishing an MSc in Biomedical Engineering at Sharif University of Technology and I am interested in the doctoral position that combines physics-based modeling and artificial intelligence for devices made from two-dimensional materials. My background is machine learning on small hardware, and my thesis was a voice assistant built around a 75k-parameter model on a Raspberry Pi.\n\nI have not worked on device physics. Would a candidate who comes from the machine learning side and learns the physics in the first year be considered?\n\nMy CV is attached.\n\nKind regards,\nMahrad Ghazli\nMSc Biomedical Engineering, Sharif University of Technology\nmge.goat@gmail.com"}, {"id": "ref_mohammadzadeh", "batch": 1, "country": "Iran", "who": "Referee request, Dr. Hoda Mohammadzadeh", "where": "Sharif University of Technology, your thesis advisor", "why": "Basel needs two or three referees. Ask your advisor first, she is your strongest one. The message is in Persian.", "kind": "Email", "deadline": "2026-11-27", "email": "email_ref_mohammadzadeh.txt", "note": "Attaching your CV is optional, the email says you will send it if they need it.", "verified": "2026-11-25", "address": "hoda@sharif.edu", "to_hint": "Dr. Hoda Mohammadzadeh <hoda@sharif.edu>", "subject": "درخواست معرف برای درخواست پذیرش دکتری", "body": "سلام و وقت بخیر، استاد گرامی دکتر محمدزاده،\n\nامیدوارم حالتان خوب باشد. بنده در حال ارسال درخواست برای یک موقعیت دکتری در زمینه یادگیری ماشین برای سلامت در دانشگاه بازل سوئیس، دپارتمان مهندسی پزشکی هستم. در فرم درخواست، اطلاعات تماس دو تا سه معرف خواسته شده است و خوشحال می‌شوم اگر بپذیرید یکی از معرف‌های بنده باشید. در فرم فقط نام، سمت و ایمیل شما نوشته می‌شود و در صورت نیاز رزومه و توضیح موقعیت را برایتان می‌فرستم.\n\nمهلت ارسال درخواست ۷ آذر است. ممنون می‌شوم اگر تا پایان این هفته پاسخ کوتاهی بدهید.\n\nبا سپاس فراوان،\nمهراد قازلی\nmge.goat@gmail.com"}, {"id": "ref_attaran", "batch": 1, "country": "Iran", "who": "Referee request, Dr. Neda Attaran", "where": "Islamic Azad University, Science and Research Branch", "why": "She is your bachelor-years professor and co-author of the hydrogel paper. Her email comes from that paper. The message is in Persian.", "kind": "Email", "deadline": "2026-11-27", "email": "email_ref_attaran.txt", "note": "Attaching your CV is optional, the email says you will send it if they need it.", "verified": "2026-11-25", "address": "neda.attaran@srbiau.ac.ir", "to_hint": "Dr. Neda Attaran <neda.attaran@srbiau.ac.ir>", "subject": "درخواست معرف برای درخواست پذیرش دکتری", "body": "سلام و وقت بخیر، دکتر عطاران گرامی،\n\nامیدوارم حالتان خوب باشد. بنده کارشناسی خود را در واحد علوم و تحقیقات گذرانده‌ام و ارشد مهندسی پزشکی را در دانشگاه صنعتی شریف تمام کرده‌ام. اکنون برای یک موقعیت دکتری در زمینه یادگیری ماشین برای سلامت در دانشگاه بازل سوئیس، دپارتمان مهندسی پزشکی، درخواست می‌دهم. در فرم درخواست، اطلاعات تماس دو تا سه معرف خواسته شده است و خوشحال می‌شوم اگر بپذیرید یکی از معرف‌های بنده باشید. شما کار مرا از دوران کارشناسی و از مقاله هیدروژل آلژینات می‌شناسید. در فرم فقط نام، سمت و ایمیل شما نوشته می‌شود.\n\nمهلت ارسال درخواست ۷ آذر است. ممنون می‌شوم اگر تا پایان این هفته پاسخ کوتاهی بدهید. در صورت نیاز رزومه‌ام را برایتان می‌فرستم.\n\nبا سپاس فراوان،\nمهراد قازلی\nmge.goat@gmail.com"}, {"id": "ref_jahed", "batch": 1, "country": "Iran", "who": "Referee request, Dr. Mehran Jahed", "where": "Sharif University of Technology", "why": "Optional second Sharif referee, Associate Professor in Electrical Engineering. His email is from the official Sharif EE faculty page. Fill the brackets with the course or project he knows you from. The message is in Persian.", "kind": "Email", "deadline": "2026-11-27", "email" Azad University, Science and Research Branch, Biomedical Engineering", "why": "Optional Azad referee. His email is the correspondence address in his 2025 and 2023 papers, a Gmail address. Fill the brackets with the course or project he knows you from. The message is in Persian.", "kind": "Email", "deadline": "2026-11-27", "email": "email_ref_baharifar.txt", "address": "baharifar.h@gmail.com", "note": "Fill the part in square brackets before you send. Attaching your CV is optional.", "verified": "2026-11-25", "to_hint": "Dr. Hadi Baharifar <baharifar.h@gmail.com>", "subject": "درخواست معرف برای درخواست پذیرش دکتری", "body": "سلام و وقت بخیر، دکتر بهاری‌فر گرامی،\n\nامیدوارم حالتان خوب باشد. بنده کارشناسی خود را در واحد علوم و تحقیقات گذرانده‌ام و ارشد مهندسی پزشکی را در دانشگاه صنعتی شریف تمام کرده‌ام. اکنون برای یک موقعیت دکتری در زمینه یادگیری ماشین برای سلامت در دانشگاه بازل سوئیس، دپارتمان مهندسی پزشکی، درخواست می‌دهم. در فرم درخواست، اطلاعات تماس دو تا سه معرف خواسته شده است و خوشحال می‌شوم اگر بپذیرید یکی از معرف‌های بنده باشید. شما کار مرا از [اسم درس یا پروژه‌ای که با هم داشتیم] می‌شناسید. در فرم فقط نام، سمت و ایمیل شما نوشته می‌شود.\n\nمهلت ارسال درخواست ۷ آذر است. ممنون می‌شوم اگر تا پایان این هفته پاسخ کوتاهی بدهید. در صورت نیاز رزومه‌ام را برایتان می‌فرستم.\n\nبا سپاس فراوان،\nمهراد قازلی\nmge.goat@gmail.com"}, {"id": "ref_javanmardi", "batch": 1, "country": "Iran", "who": "Referee request, Dr. Masoud Javanmardi", "where": "Islamic Azad University, Science and Research Branch, biomaterials course", "why": "Optional Azad referee who taught you biomaterials. I could not find a published email for him, so type the one you have in the To box. The message is in Persian.", "kind": "Email", "deadline": "2026-11-27", "email": "email_ref_javanmardi.txt", "note": "Type his email in the To box before you send. Attaching your CV is optional.", "verified": "2026-11-25", "to_hint": "Dr. Masoud Javanmardi (type the email you have in the To box)", "subject": "درخواست مع const gh=(method,body)=>fetch(`https://api.github.com/repos/${REPO}/contents/${PFILE}`+(method==="GET"?"?ref=main&t="+Date.now():""),{method,headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined});
let q=[],qt=null;
function logEvent(kind,id,on){if(!tok())return;q.push({kind,id,on,at:new Date().toISOString()});clearTimeout(qt);qt=setTimeout(()=>flush(0),2500)}
async function flush(n){if(!q.length)return;const batch=q.splice(0);try{const g=await gh("GET");let p={sent:{},opened:{},log:[],updated:""},sha;if(g.ok){const j=await g.json();sha=j.sha;p=JSON.parse(b64d(j.content))}
 for(const e of batch){const bk=p[e.kind]=p[e.kind]||{};if(e.on){if(e.kind==="sent")bk[e.id]=bk[e.id]||e.at;else bk[e.id]=e.at}else delete bk[e.id];(p.log=p.log||[]).push(e)}
 p.log=p.log.slice(-400);p.updated=new Date().toISOString();
 const r=await gh("PUT",{message:"Progress update",content:b64e(JSON.stringify(p,null,1)+"\n"),sha,branch:"main"});
 if(r.status===409&&n<2){q.unshift(...batch);return flush(n+1)}
 if(!r.ok)throw new Error(r.status);gst("Saved to GitHub")}catch(e){q.unshift(...batch);gst("Could not save, will retry on the next click")}}
async function loadProgress(){try{let p;if(tok()){const g=await gh("GET");if(g.ok)p=JSON.parse(b64d((await g.json()).content))}
 if(!p){const r=await fetch("data/progress.json?"+Date.now());if(r.ok)p=await r.json()}
 if(!p)return;let ch=false;for(const k in (p.sent||{}))if(sent[k]===undefined){sent[k]=p.sent[k];ch=true}
 if(tok()){for(const k in sent)if(sent[k]&&!(p.sent||{})[k]){logEvent("sent",k,true)}}
 if(ch){save();render()}}catch(e){}}
function footer(){const f=$("#foot");if(tok()){f.innerHTML='Saving to GitHub automatically, Claude can see it. <span id="gst"></span> <a href="#" id="disc">Disconnect</a>';$("#disc").onclick=e=>{e.preventDefault();try{localStorage.removeItem(TK)}catch(x){}footer()}}
 else{f.innerHTML='<b>Save my progress for Claude.</b> Create a token that can only edit this one repo, paste it once, and every email you open or mark as sent is saved to GitHub. <a target="_blank" rel="noopener" href="https://github.com/settings/personal-access-tokens/new">Create the token</a> (Repository access: only phd-tracker. Permissions: Contents, Read and write). <input id="tkin" type="password" placeholder="paste token here" style="width:230px"> <button class="btn" id="tksave">Connect</button> <span id="gst"></span>';
  $("#tksave").onclick=async()=>{const v=$("#tkin").value.trim();if(!v)return;try{localStorage.setItem(TK,v)}catch(e){}const g=await gh("GET");if(g.ok){gst("");footer();gst("Connected");loadProgress()}else{try{localStorage.removeItem(TK)}catch(e){}gst("That token did not work. Check it is only for phd-tracker with Contents read and write.")}}}}
let tab="plan";
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){prompt("Copy this text",t)}}
function gmail(st){return "https://mail.google.com/mail/?view=cm&fs=1"+(st.address?"&to="+encodeURIComponent(st.address):"")+"&su="+encodeURIComponent(st.subject||"")+"&body="+encodeURIComponent(st.body||"")}
function apply(st){return st.kind==="Apply online"}
const FLAG={Germany:"🇩🇪",Austria:"🇦🇹",Netherlands:"🇳🇱",Sweden:"🇸🇪",Finland:"🇫🇮",Switzerland:"🇨🇭"};
function fl(c){return (FLAG[c]||"")+" "}
function gmailReply(st){return "https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(st.address||"")+"&su="+encodeURIComponent("Re: "+(st.subject||""))+"&body="+encodeURIComponent(st.reply_body||"")}
function days(d){return Math.round((new Date(d)-new Date(D.updated))/864e5)}
function planView(){
  const steps=[...(D.plan.steps||[])].sort((a,b)=>(a.batch-b.batch)||((b.hot?1:0)-(a.hot?1:0))||((a.deadline||'9999').localeCompare(b.deadline||'9999'))||((b.match||0)+(b.chance||0)-(a.match||0)-(a.chance||0))),done=steps.filter(s=>sent[s.id]).length,next=steps.find(s=>!sent[s.id]);
  let h=`<section class="next">${next?`<small>Your next step</small><h2>${fl(next.country)}${esc(next.kind==="Apply online"?"Apply to":"Email")} ${esc(next.who)}, ${esc(next.where)}</h2><p>${esc(next.why)}</p>`
    :`<small>Batch done</small><h2>All sent. Now wait for replies.</h2><p>When someone answers, paste it to Claude and it will write your reply. If nobody answers in 10 days, ask Claude for follow-ups and batch 2.</p>`}</section>
  <div class="bar"><i style="width:${steps.length?100*done/steps.length:0}%"></i></div><div class="count">${done} of ${steps.length} done</div>
  <div class="how"><b>How each email works</b><ol>
   <li>Press <b>Open in Gmail</b>. The subject and text are filled in for you.</li>
   <li>Press <b>Professor's page</b> and copy their email address into the "To" box (it is filled already when we know it).</li>
   <li>Attach your CV, <code>Mahrad_Ghazli_Academic_CV_2026-11-13.pdf</code>.</li>
   <li>Send, then press <b>Mark as sent</b> here.</li></ol>
   <b>Steps that say "Apply online"</b> go through the university's own portal, not email. Press <b>Copy cover letter</b>, paste it into a document, save it as PDF and upload it with your CV.
   <div class="visa" style="margin-top:8px">Send 2 or 3 a day, in the morning Europe time. Orange ones are real open PhD positions, do those first.<br><b>Match</b> is how close their research is to yours. <b>Chance</b> is a rough guess of getting a positive reply, based on competition and whether they have money now. Ten emails at chance 5 usually give two or three real conversations.</div></div>
`;
  let lastBatch=0;
  steps.forEach((st,i)=>{
    if(st.batch!==lastBatch){lastBatch=st.batch;h+=`<h3>${({1:"Batch 1, this week",2:"Batch 2, next week (easier places, more chances)",3:"Batch 3, the week after (broad list, send 3 to 5 a day)"})[st.batch]}</h3>`}
    const isDone=!!sent[st.id],dl=st.deadline?`<span class="tag dl">Deadline ${esc(st.deadline)}, ${days(st.deadline)} days</span>`:"";
    h+=`<article class="step ${st.hot?"hot":""} ${isDone?"done":""}"><div class="num">${isDone?"✓":i+1}</div><div>
      <div class="who">${fl(st.country)}${st.kit?`<a class="whol" href="#kit=${st.id}" title="Open the copy-paste page">${esc(st.who)}</a>`:esc(st.who)}</div><div class="where">${esc(st.where)}, ${esc(st.country)}</div>
      <div class="tags">${st.hot?`<span class="tag hot">Open position</span>`:""}${st.match?`<span class="tag score">Match ${st.match}/10</span><span class="tag score">Chance ${st.chance}/10</span>`:""}${st.competition?`<span class="tag">Competition ${esc(st.competition)}</span>`:""}<span class="tag country">${({Germany:"🇩🇪",Austria:"🇦🇹",Netherlands:"🇳🇱"})[st.country]||""} ${esc(st.country)}</span><span class="tag">${esc(st.kind)}</span>${st.approved?`<span class="tag">Approved list ${esc(st.approved)}</span>`:""}${dl}</div>
      <div class="why">${esc(st.why)}</div>${st.reply?`<div class="note">Reply, ${esc(st.reply)}</div>`:""}${st.reply_body?`<div class="actions"><a class="btn main" href="${gmailReply(st)}" target="_blank" rel="noopener">Reply in Gmail</a><button class="btn" data-copyreply="${st.id}">Copy reply</button></div><details class="preview"><summary>Read my reply</summary><pre>${esc(st.reply_body)}</pre></details>`:""}${st.latest?`<div class="why"><b>Latest work, 2026</b> ${esc(st.latest)}</div>`:""}${st.note?`<div class="note">${esc(st.note)}</div>`:""}
      <div class="actions">
        ${apply(st)?`<a class="btn main" data-open="${st.id}" href="${esc(st.page)}" target="_blank" rel="noopener">Open application</a>${st.body?`<button class="btn" data-copy="${st.id}">Copy cover letter</button>`:""}`
          :st.body?`<a class="btn main" data-open="${st.id}" href="${gmail(st)}" target="_blank" rel="noopener">Open in Gmail</a><button class="btn" data-copy="${st.id}">Copy email text</button>${st.page?`<a class="btn" href="${esc(st.page)}" target="_blank" rel="noopener">Professor's page</a>`:""}`
          :`<a class="btn main" data-open="${st.id}" href="${esc(st.page)}" target="_blank" rel="noopener">Open application</a>`}
        ${st.kit?`<a class="btn main" href="#kit=${st.id}">Copy-paste page</a>`:""}
        <button class="btn ${isDone?"ok":""}" data-sent="${st.id}">${isDone?"Sent ✓":"Mark as sent"}</button>
      </div>
      ${st.body?`<details class="preview"><summary>${apply(st)?"Read the cover letter":"Read the email"}</summary><pre${/[؀-ۿ]/.test(st.body)?' dir="rtl" style="text-align:right"':''}>${apply(st)?"":`Subject: ${esc(st.subject)}\n\n`}${esc(st.body)}</pre></details>`:""}
    </div></article>`;
  });
  h+=`<h3>Visa, in one line each</h3><div class="how visa"><b>Austria</b> is the easiest, you can file via Istanbul. <b>Germany</b>, register on the embassy waitlist as soon as you have any offer. <b>Netherlands</b>, the entry visa for Iranians was suspended in August, ask the university early.</div>`;
  return h;
}
function dbView(){
  const P=D.positions,cs=[...new Set(P.map(p=>p.country))].sort();
  return `<div class="dbbar"><input id="q" placeholder="Search"><select id="fc"><option value="">All countries</option>${cs.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div id="dbl"></div>`;
}
function dbList(){
  const q=($("#q")?.value||"").toLowerCase(),c=$("#fc")?.value||"";
  const P=D.positions.filter(p=>!["expired","skip"].includes(p.status)&&(!c||p.country===c)&&(!q||JSON.stringify(p).toLowerCase().includes(q)))
    .sort((a,b)=>(+b.fit_1_10||0)-(+a.fit_1_10||0));
  $("#dbl").innerHTML=P.map(p=>`<div class="item"><b>${fl(p.country)}${esc(p.pi)}</b> <span class="m">· ${esc(p.institution)}, ${esc(p.country)} · fit ${esc(p.fit_1_10)}/10${p.type==="advert"?` · open job, deadline ${esc(p.deadline)}`:" · email"}</span>
    <div>${esc(p.title)}</div><details><summary>Details</summary><div class="m">${esc(p.topic)}</div><div>${esc(p.funding||"")}</div>
    ${p.apply_url?`<div><a href="${esc(p.apply_url)}" target="_blank" rel="noopener">Official page</a></div>`:""}${p.pi_url?`<div><a href="${esc(p.pi_url)}" target="_blank" rel="noopener">Professor</a></div>`:""}
    ${p.red_flags?`<div class="m">Watch out, ${esc(p.red_flags)}</div>`:""}</details></div>`).join("")||`<div class="item">Nothing matches.</div>`;
}
function countryView(){
  const cs=[...D.countries].sort((a,b)=>(a.rank??99)-(b.rank??99));
  return `<p class="sub">Your priority is the Netherlands, Austria and Germany. This table is background on visas and work after the PhD.</p><table><tr><th>Country</th><th>Visa from Iran</th><th>Work after</th><th>Economy</th><th>Note</th></tr>${
    cs.map(c=>`<tr><td><b>${esc(c.country)}</b></td><td>${esc(c.visa)}/10</td><td>${esc(c.work)}/10</td><td>${esc(c.economy)}/10</td><td>${esc(c.note)}</td></tr>`).join("")}</table>`;
}
const kitStep=()=>{const m=location.hash.match(/^#kit=([\w-]+)/);return m?(D.plan.steps||[]).find(s=>s.id===m[1]&&s.kit):null};
const kget=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
function kitView(st){
  const k=st.kit;
  let h=`<p><a href="#" id="kback">&larr; Back to the plan</a></p><section class="next"><small>Copy-paste page</small><h2>${esc(k.title)}</h2><p>${esc(k.intro||"")}</p></section>`;
  if(st.page)h+=`<div class="actions"><a class="btn main" data-open="${esc(st.id)}" href="${esc(st.page)}" target="_blank" rel="noopener">Open the application form</a></div>`;
  (k.blocks||[]).forEach((b,i)=>{
    h+=`<h3>${esc(b.heading)}</h3>${b.note?`<div class="m" style="margin:-4px 0 8px">${esc(b.note)}</div>`:""}`;
    (b.fields||[]).forEach((f,j)=>{
      const key=`phdkit-${st.id}-${i}-${j}`,val=f.private?kget(key):(f.value||"");
      const long=f.max>120||f.multiline;
      h+=`<div class="kf"><label for="${key}">${esc(f.label)}${f.max?` <span class="cnt" data-cnt="${key}"></span>`:""}</label>`
        +(long?`<textarea id="${key}" rows="${f.rows||6}" data-max="${f.max||0}" ${f.private?'data-private="1"':""} placeholder="${esc(f.hint||"")}">${esc(val)}</textarea>`
               :`<input id="${key}" data-max="${f.max||0}" ${f.private?'data-private="1"':""} value="${esc(val)}" placeholder="${esc(f.hint||"")}">`)
        +`<div class="kact"><button class="btn main" data-kcopy="${key}">Copy</button>${f.private?`<span class="m">Paste it once. It is saved only in this browser, never on the public site.</span>`:(f.hint?`<span class="m">${esc(f.hint)}</span>`:"")}</div></div>`;
    });
  });
  if(k.files&&k.files.length)h+=`<h3>Files to upload</h3><div class="kf">${k.files.map(f=>`<div class="fl"><b>${esc(f.slot)}</b><span><code>${esc(f.file)}</code>${f.note?` <span class="m">${esc(f.note)}</span>`:""}</span></div>`).join("")}<div class="m" style="margin-top:8px">${esc(k.filesNote||"")}</div></div>`;
  if(k.letter&&st.body)h+=`<h3>Cover letter text</h3><div class="kf"><textarea id="phdkit-${st.id}-letter" rows="14" readonly>${esc(st.body)}</textarea><div class="kact"><button class="btn main" data-kcopy="phdkit-${st.id}-letter">Copy letter</button></div></div>`;
  return h;
}
function kitWire(){
  const upd=el=>{const c=document.querySelector(`[data-cnt="${el.id}"]`);const mx=+el.dataset.max;if(c&&mx){c.textContent=`${el.value.length} / ${mx}`;c.classList.toggle("over",el.value.length>mx)}};
  document.querySelectorAll(".kf textarea,.kf input").forEach(el=>{upd(el);el.addEventListener("input",()=>{upd(el);if(el.dataset.private){try{localStorage.setItem(el.id,el.value)}catch(e){}}})});
  document.querySelectorAll("[data-kcopy]").forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.kcopy);if(!el||!el.value){toast("Nothing to copy yet, paste it into the box first");return}copy(el.value,"Copied")});
  const bk=document.getElementById("kback");if(bk)bk.onclick=e=>{e.preventDefault();location.hash=""};
  document.querySelectorAll("[data-open]").forEach(a=>a.addEventListener("click",()=>logEvent("opened",a.dataset.open,true)));
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
function render(){
  const ks=kitStep();
  if(ks){$("#main").innerHTML=kitView(ks);kitWire();return}
  $("#main").innerHTML=tab==="plan"?planView():tab==="db"?dbView():countryView();
  if(tab==="db"){dbList();$("#q").oninput=dbList;$("#fc").oninput=dbList}
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const st=D.plan.steps.find(s=>s.id===b.dataset.copy);copy(apply(st)?st.body:`Subject: ${st.subject}\n\n${st.body}`,apply(st)?"Cover letter copied":"Email copied")});
  document.querySelectorAll("[data-copyreply]").forEach(b=>b.onclick=()=>{const st=D.plan.steps.find(s=>s.id===b.dataset.copyreply);copy(st.reply_body,"Reply copied")});
  document.querySelectorAll("[data-sent]").forEach(b=>b.onclick=()=>{const id=b.dataset.sent;sent[id]=!sent[id];save();logEvent("sent",id,!!sent[id]);render()});
  document.querySelectorAll("[data-open]").forEach(a=>a.addEventListener("click",()=>logEvent("opened",a.dataset.open,true)));
}
$("#sub").textContent=`Fully funded PhDs in the Netherlands, Austria and Germany. Updated ${D.updated}.`;
footer();
$("#tabs").onclick=e=>{if(!e.target.dataset.t)return;tab=e.target.dataset.t;if(location.hash){history.replaceState(null,"",location.pathname+location.search)}[...$("#tabs").children].forEach(b=>b.classList.toggle("on",b===e.target));render()};
(function(){const m=location.hash.match(/^#setup=([\w\-+/=]+)/);if(!m)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));for(const k in (o.v||{}))if(/^phdkit-/.test(k))localStorage.setItem(k,String(o.v[k]));history.replaceState(null,"",location.pathname+location.search);if(o.go)location.hash="#kit="+o.go;setTimeout(()=>toast("Saved in this browser"),400)}catch(e){}})();
render();
loadProgress();
</script>
</body>
</html>
